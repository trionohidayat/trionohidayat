<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#090a0f" />
    </linearGradient>
    <linearGradient id="border-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="chevron-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <linearGradient id="cursor-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <!-- Background container with rounded corners and subtle border -->
  <rect
    x="24"
    y="24"
    width="464"
    height="464"
    rx="110"
    ry="110"
    fill="url(#bg-gradient)"
    stroke="url(#border-gradient)"
    stroke-width="18"
  />

  <!-- Subtle inner border -->
  <rect
    x="42"
    y="42"
    width="428"
    height="428"
    rx="92"
    ry="92"
    fill="none"
    stroke="#38bdf8"
    stroke-width="4"
    stroke-opacity="0.3"
  />

  <!-- Terminal Chevron '>' -->
  <polyline
    points="135,155 245,256 135,357"
    stroke="url(#chevron-gradient)"
    stroke-width="48"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Terminal Cursor '_' -->
  <line
    x1="280"
    y1="357"
    x2="380"
    y2="357"
    stroke="url(#cursor-gradient)"
    stroke-width="48"
    stroke-linecap="round"
  />
</svg>